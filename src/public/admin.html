<!doctype html><html><head><meta charset="utf-8"><title>Админка</title><link rel="stylesheet" href="/styles.css"></head><body>

<main class="container"><section class="card"><h1>Вход сотрудников</h1><form id="login" class="grid"><input name="email" value="admin@local"><input type="password" name="password" value="admin123"><button class="full">Войти</button></form><p id="loginOut"></p></section>
<section class="card"><h2>Заявки</h2><div class="grid"><select id="fStatus"><option value="">Все</option><option>new</option><option>in_progress</option><option>closed</option></select><button id="refresh">Обновить</button><button id="export">Экспорт CSV</button></div><table class="table" id="tbl"></table></section>
<section class="card"><h2>Карточка заявки и чат</h2><div id="card"></div><div class="chat" id="chat"></div><form id="reply" class="grid"><input name="body" class="full" placeholder="Ответ операторa"><button class="full">Отправить</button></form></section>
<section class="card"><h2>Журнал изменений</h2><ul id="audit"></ul></section><section class="card"><h2>Статистика</h2><pre id="stats"></pre></section></main>
